<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mis 15</title>

  <link rel="stylesheet" href="estilos.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EDDD">
</head>

<body>

<main>

<!-- MUSICA -->
<audio id="musicaFondo" loop>
  <source src="assets/cancion.mp3" type="audio/mpeg">
</audio>

<button id="btnMusica" class="btn-musica-flotante">
    <img id="iconoMusica" src="assets/musica_off.svg" alt="Música">
</button>

  <!-- INICIO -->
  <section id="inicio">
    <img class="tarjeta" src="" alt="Inicio">
  </section>

  <!-- FECHA -->
  <section id="fecha">
    <img class="tarjeta" src="" alt="Inicio">
  </section>

  <!-- TEXTO -->
  <section id="texto">
    <img class="tarjeta" src="" alt="Inicio">
  </section>

  <!-- HORARIO -->
  <section id="horario">
    <img class="tarjeta" src="" alt="Inicio">
  </section>

  <!-- UBICACION -->
  <section id="ubicacion">
    <img class="tarjeta" src="" alt="Inicio">

    <!-- BOTÓN MAPA (lo activamos después) -->
    <button class="btn-ubicacion">
      Abrir mapa
    </button>
  </section>

  <!-- DRESS CODE -->
  <section id="dresscode">
    <img class="tarjeta" src="" alt="Inicio">
  </section>

  <!-- MENU -->
  <section id="menu">
    <img class="tarjeta" src="" alt="Inicio">
   
    <!-- BOTÓN MENU -->
    <button class="btn-menu">
      Menu
    </button>
  </section>

  <!-- MUSICA -->
  <section id="musica">
    <img class="tarjeta" src="" alt="Inicio">

    <!-- BOTÓN PLAYLIST -->
    <button class="btn-musica">
      Escuchar playlist
    </button>
  </section>

  <!-- REGALOS -->
  <section id="regalos">
    <img class="tarjeta" src="" alt="Inicio">

    <!-- BOTONES REGALOS -->
    <button class="btn-regalos"></button>
  </section>

  <!-- CONFIRMAR -->
  <section id="confirmar">
    <img class="tarjeta" src="" alt="Inicio">

    <!-- BOTÓN WHATSAPP -->
    <button class="btn-confirmar">
      Confirmar asistencia
    </button>
  </section>

  <!-- FOTOS -->
  <section id="fotos">
    <img class="tarjeta" src="" alt="Inicio">

    <!-- BOTÓN GALERÍA -->
    <button class="btn-fotos">
      Ver fotos
    </button>
  </section>

  <!-- INSTAGRAM -->
  <section id="instagram">
    <img class="tarjeta" src="" alt="Inicio">

    <!-- BOTÓN INSTAGRAM -->
    <!--
    <button class="btn-instagram">
      Instagram
    </button>
    -->
  </section>

 
</main>

<script>

// Detectar Safari en iPhone/iPad
function esSafariIOS() {
  return /^((?!chrome|android).)*safari/i.test(navigator.userAgent) &&
         /iP(ad|hone|od)/.test(navigator.userAgent);
}

// Cargar imágenes según dispositivo
function cargarImagenes() {

  const sufijo = esSafariIOS()
    ? '_ios.svg'
    : '_android.svg';

  document.querySelector('#inicio .tarjeta').src =
    'assets/Inicio' + sufijo;

  document.querySelector('#fecha .tarjeta').src =
    'assets/Fecha' + sufijo;

  document.querySelector('#texto .tarjeta').src =
    'assets/Text' + sufijo;

  document.querySelector('#horario .tarjeta').src =
    'assets/Horario' + sufijo;

  document.querySelector('#ubicacion .tarjeta').src =
    'assets/Ubicacion' + sufijo;

  document.querySelector('#dresscode .tarjeta').src =
    'assets/DressCode' + sufijo;

  document.querySelector('#menu .tarjeta').src =
    'assets/Menu' + sufijo;

  document.querySelector('#musica .tarjeta').src =
    'assets/Musica' + sufijo;

  document.querySelector('#regalos .tarjeta').src =
    'assets/Regalos' + sufijo;

  document.querySelector('#confirmar .tarjeta').src =
    'assets/Confirmar' + sufijo;

  document.querySelector('#fotos .tarjeta').src =
    'assets/Fotos' + sufijo;

  document.querySelector('#instagram .tarjeta').src =
    'assets/Instagram' + sufijo;
  
}

window.addEventListener('load', cargarImagenes);

//LINKS DE BOTONES _ Ubicación
const btnUbicacion = document.querySelector('.btn-ubicacion');

if (btnUbicacion) {
  btnUbicacion.addEventListener('click', () => {
    window.open('https://maps.app.goo.gl/735ysSNXP47BRM8k8', '_blank');
  });
}

//LINKS DE BOTONES _ Menu
const btnMenu = document.querySelector('.btn-menu');

if (btnMenu) {
  btnMenu.addEventListener('click', () => {
    window.open('https://docs.google.com/forms/d/e/1FAIpQLSeyjGyAum25W42dMwfxUsSsZluJsPAJDFFxqvb4i9lk4P5UIg/viewform?usp=publish-editor', '_blank');
  });
}

//LINKS DE BOTONES _ Musica
const btnMusica = document.querySelector('.btn-musica');

if (btnMusica) {
  btnMusica.addEventListener('click', () => {
    window.open('https://open.spotify.com/playlist/0aRce8AQpZp2HeGeOeN1Lo?si=qNaBS-c7RmCinyo5JnkkYA&utm_source=whatsapp&pt=81ecb488a00efb9bb28eed4c05dcc376&pi=bfL_CUDPSj6sL', '_blank');
  });
}

// LINKS DE BOTONES _ Confirmar
const btnConfirmar = document.querySelector('.btn-confirmar');

if (btnConfirmar) {
  btnConfirmar.addEventListener('click', () => {
    window.open('https://docs.google.com/forms/d/e/1FAIpQLSeKWuqFrkcvnQwmBN0ZXf60Eq0T1mUGqUaWxS_mm7uDI2n5wQ/viewform?usp=sharing&ouid=112332153500746426537', '_blank');
  });
}

//LINKS DE BOTONES _ Fotos
const btnFotos = document.querySelector('.btn-fotos');

if (btnFotos) {
  btnFotos.addEventListener('click', () => {
    window.open('https://drive.google.com/drive/folders/1S1K40RFAXgjfj8pXKh_8I4RTgL0C761G?usp=sharing', '_blank');
  });
}

// BOTÓN REGALOS
const btnRegalos = document.querySelector(".btn-regalos");

if (btnRegalos) {

    btnRegalos.addEventListener("click", async () => {

        try {

            await navigator.clipboard.writeText("mili.joaco.mz");

            alert("¡Alias copiado al portapapeles!");

        } catch (err) {

            alert("No se pudo copiar el alias.");

        }

    });

}

// Animación al aparecer

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add("visible");

        }

    });

},{
    threshold:0.2
});

document.querySelectorAll("section").forEach(section=>{

    observer.observe(section);

});

//Musica fondo
const musica = document.getElementById("musicaFondo");
const botonMusica = document.getElementById("btnMusica");
const iconoMusica = document.getElementById("iconoMusica");

let reproduciendo = false;

botonMusica.addEventListener("click", () => {

    if(reproduciendo){

        musica.pause();
        iconoMusica.src = "assets/musica_off.svg";
        reproduciendo = false;

    }else{

        musica.play();

        iconoMusica.src = "assets/musica_on.svg";
        reproduciendo = true;

    }

});

</script>

</body>
</html>
